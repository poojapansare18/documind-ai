name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Run tests
        run: python -m pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start hardened container
        env:
          DOCUMIND_API_KEY: ci-test-secret
        run: |
          docker compose up --build -d
          cleanup() {
            docker compose logs --no-color || true
            docker compose down -v || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          unauthorised_status=$(curl -sS -o /tmp/unauthorised.json -w "%{http_code}" http://127.0.0.1:8000/documents)
          test "$unauthorised_status" = "401"
          authorised_status=$(curl -sS -o /tmp/authorised.json -w "%{http_code}" -H "X-API-Key: ci-test-secret" http://127.0.0.1:8000/documents)
          test "$authorised_status" = "200"
          container_id=$(docker compose ps -q documind)
          health_status=$(docker inspect --format='{{.State.Health.Status}}' "$container_id")
          test "$health_status" = "healthy"
