services:
  documind:
    build: .
    init: true
    read_only: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DOCUMIND_API_KEY: ${DOCUMIND_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      DOCUMIND_EMBEDDING_MODEL: ${DOCUMIND_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      DOCUMIND_DB_PATH: ${DOCUMIND_DB_PATH:-data/documind.db}
      FASTEMBED_CACHE_PATH: ${FASTEMBED_CACHE_PATH:-fastembed_cache}
      DOCUMIND_OCR_LANGUAGE: ${DOCUMIND_OCR_LANGUAGE:-eng}
      DOCUMIND_OCR_DPI: ${DOCUMIND_OCR_DPI:-200}
      TESSDATA_PREFIX: ${TESSDATA_PREFIX:-/usr/share/tesseract-ocr/5/tessdata}
    volumes:
      - documind_data:/app/data
      - documind_models:/app/fastembed_cache
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  documind_data:
  documind_models:
